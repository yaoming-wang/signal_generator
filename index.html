<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SignalPro-Visio</title>
    <style>
        :root {
            --accent: #4f46e5; --accent-hover: #4338ca;
            --bg-page: #f1f5f9; --bg-card: #ffffff;
            --border: #e2e8f0; --text-main: #1e293b; --text-sub: #64748b;
            --gray-light: #94a3b8; --radius-main: 16px; --radius-sm: 8px;
            --success: #10b981;
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body { margin: 0; display: flex; height: 100vh; background: var(--bg-page); color: var(--text-main); font-family: 'Inter', system-ui, sans-serif; }

        .sidebar { width: 460px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.02); }
        .sidebar-header { padding: 32px 24px; border-bottom: 2px solid var(--bg-page); }
        .sidebar-header h2 { margin: 0; font-size: 22px; font-weight: 800; }
        .sidebar-scroll { flex: 1; overflow-y: auto; padding: 24px; }

        .module { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-main); margin-bottom: 24px; overflow: hidden; }
        .module-header { padding: 18px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #fff; user-select: none; }
        .module-header h3 { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 14px; }
        .arrow { width: 8px; height: 8px; border-right: 2px solid var(--gray-light); border-bottom: 2px solid var(--gray-light); transform: rotate(45deg); transition: 0.3s; }
        .module.collapsed .arrow { transform: rotate(-135deg); }
        .module.collapsed .module-content { display: none; }
        .module-content { padding: 24px; border-top: 1px solid var(--border); background: #fafbfc; }

        .label { display: block; font-size: 11px; font-weight: 800; color: var(--text-sub); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .input-box { width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; outline: none; background: #fff; }
        
        .box-row { display: flex; flex-wrap: wrap; align-items: center; gap: 15px; padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: #f8fafc; margin-bottom: 15px; }
        .check-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
        
        .grid { display: grid; gap: 12px; margin-bottom: 12px; }
        .grid-2 { grid-template-columns: 1fr 1fr; }
        .grid-3 { grid-template-columns: 1fr 1fr 1fr; }

        .btn-master { background: #fff; border: 1.5px solid var(--accent); color: var(--accent); padding: 12px; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-bottom: 24px; }
        .btn-add { background: var(--accent); color: white; border: none; border-radius: 12px; padding: 18px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 12px; transition: 0.2s; }
        .btn-export { background: var(--success); color: white; border: none; border-radius: 12px; padding: 18px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 40px; box-shadow: 0 8px 16px rgba(16, 185, 129, 0.2); }
        .btn-del { color: #ef4444; background: #fff; border: 1px solid #fee2e2; padding: 10px; border-radius: 8px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 15px; }

        .vis-toggle { background: none; border: none; cursor: pointer; padding: 0; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: var(--accent); }
        .vis-toggle.hidden { color: var(--gray-light); }
        .seg-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-top: 12px; border-left: 4px solid #cbd5e1; }

        .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; }
        .canvas-card { background: white; padding: 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.06); border: 1px solid var(--border); }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-header"><h2>SignalPro <span style="font-weight: 300; color: var(--text-sub);">| Expert</span></h2></div>
    <div class="sidebar-scroll">
        <div class="module" id="mod-global">
            <div class="module-header" onclick="toggleMod('mod-global')"><h3>背景参数与全局选项</h3><div class="arrow"></div></div>
            <div class="module-content">
                <button class="btn-master" onclick="toggleAllWaves()"><span id="masterLabel">一键关闭所有波形</span></button>
                <span class="label">网格开关</span>
                <div class="box-row">
                    <label class="check-item"><input type="checkbox" id="gridH" checked onchange="draw()"> 横向</label>
                    <label class="check-item"><input type="checkbox" id="gridV" checked onchange="draw()"> 纵向</label>
                </div>
                <div class="box-row"><label class="check-item"><input type="checkbox" id="sumEnable" onchange="render()"> 开启叠加模式</label></div>
                <div class="grid grid-2">
                    <div><span class="label">X轴格宽</span><input type="number" id="gX" class="input-box" value="60" oninput="draw()"></div>
                    <div><span class="label">Y轴格高</span><input type="number" id="gY" class="input-box" value="60" oninput="draw()"></div>
                </div>
                <div class="grid grid-3">
                    <div><span class="label">颜色</span><input type="color" id="gCol" class="input-box" value="#f1f5f9" onchange="draw()"></div>
                    <div><span class="label">线宽</span><input type="number" id="gStr" class="input-box" value="1.5" step="0.5" oninput="draw()"></div>
                    <div><span class="label">线型</span><select id="gSty" class="input-box" onchange="draw()"><option value="solid">实线</option><option value="dashed">虚线</option></select></div>
                </div>
            </div>
        </div>

        <div id="sumPanelContainer"></div>
        <div id="channelContainer"></div>
        
        <button class="btn-add" onclick="addChannel()">+ 新建信号通道</button>
        <button class="btn-export" onclick="exportSVG()">⬇ 导出 SVG 矢量图</button>
    </div>
</aside>

<main class="main">
    <div class="canvas-card" id="svgFrame"></div>
</main>

<script>
    let channels = [{
        id: Date.now(), visible: true, collapsed: false, color: "#4f46e5", stroke: 3, shift: 0, 
        segments: [{ type: 'ramp', per: 4, yOff: 3, amp: 1.5, duty: 50 }]
    }];
    let sumSelection = [];
    let masterState = true;

    const iconEyeOpen = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const iconEyeClosed = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;

    function toggleMod(id) {
        const el = document.getElementById(id);
        el.classList.toggle('collapsed');
        const cId = id.replace('ch-mod-', '');
        const c = channels.find(x => x.id == cId);
        if(c) c.collapsed = el.classList.contains('collapsed');
    }

    function toggleAllWaves() {
        masterState = !masterState;
        channels.forEach(c => c.visible = masterState);
        document.getElementById('masterLabel').innerText = masterState ? "一键关闭所有波形" : "一键开启所有波形";
        render();
    }

    function addChannel() {
        channels.push({ 
            id: Date.now(), visible: true, collapsed: false, color: "#f59e0b", stroke: 3, shift: 0,
            segments: [{ type: 'square', per: 8, yOff: 5, amp: 1, duty: 50 }] 
        });
        render();
    }

    function setSegmentCount(cIdx, count) {
        const c = channels[cIdx];
        const newCount = Math.max(1, parseInt(count) || 1);
        while(c.segments.length < newCount) {
            const last = c.segments[c.segments.length - 1];
            c.segments.push({ ...last });
        }
        c.segments = c.segments.slice(0, newCount);
        render();
    }

    // 导出 SVG 的根本逻辑
    function exportSVG() {
        const svgData = document.getElementById('svgFrame').innerHTML;
        const blob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `SignalPro_Export_${Date.now()}.svg`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function render() {
        const sumPanel = document.getElementById('sumPanelContainer');
        if(document.getElementById('sumEnable').checked) {
            let chks = channels.map((c, i) => `<label class="check-item"><input type="checkbox" ${sumSelection.includes(c.id)?'checked':''} onchange="((id)=>{ const idx=sumSelection.indexOf(id); if(idx>-1) sumSelection.splice(idx,1); else sumSelection.push(id); draw(); })(${c.id})"> CH${i+1}</label>`).join('');
            sumPanel.innerHTML = `<div class="module" id="mod-sum"><div class="module-header" onclick="this.parentElement.classList.toggle('collapsed')"><h3>叠加运算配置</h3><div class="arrow"></div></div><div class="module-content"><span class="label">叠加源</span><div class="box-row">${chks}</div><div class="grid grid-3"><div><span class="label">基准Y</span><input type="number" id="sY" class="input-box" value="7" oninput="draw()"></div><div><span class="label">颜色</span><input type="color" id="sCol" class="input-box" value="#ef4444" onchange="draw()"></div><div><span class="label">线宽</span><input type="number" id="sStr" class="input-box" value="4" oninput="draw()"></div></div></div></div>`;
        } else { sumPanel.innerHTML = ''; }

        const container = document.getElementById('channelContainer');
        container.innerHTML = '';
        channels.forEach((c, idx) => {
            const m = document.createElement('div');
            m.className = `module ${c.collapsed ? 'collapsed' : ''}`;
            m.id = `ch-mod-${c.id}`;
            m.innerHTML = `
                <div class="module-header" onclick="toggleMod('${m.id}')">
                    <h3>
                        <button class="vis-toggle ${c.visible?'':'hidden'}" onclick="event.stopPropagation(); channels[${idx}].visible=!channels[${idx}].visible; render();">
                            ${c.visible ? iconEyeOpen : iconEyeClosed}
                        </button>
                        通道 ${idx+1}
                    </h3>
                    <div class="arrow"></div>
                </div>
                <div class="module-content">
                    <span class="label">通道全局控制</span>
                    <div class="grid grid-3">
                        <div><span class="label">全局颜色</span><input type="color" class="input-box" value="${c.color}" onchange="channels[${idx}].color=this.value; draw();" style="height:38px;padding:2px;"></div>
                        <div><span class="label">全局线宽</span><input type="number" class="input-box" value="${c.stroke}" oninput="channels[${idx}].stroke=parseFloat(this.value); draw();"></div>
                        <div><span class="label">全局平移</span><input type="number" class="input-box" value="${c.shift}" step="0.1" oninput="channels[${idx}].shift=parseFloat(this.value); draw();"></div>
                    </div>
                    
                    <div style="margin-top:15px; padding-top:15px; border-top:1px dashed var(--border);">
                        <span class="label">分段控制 (Count: ${c.segments.length})</span>
                        <input type="number" class="input-box" value="${c.segments.length}" min="1" onchange="setSegmentCount(${idx}, this.value)">
                    </div>

                    ${c.segments.map((s, si) => `
                        <div class="seg-card">
                            <span class="label">分段 ${si+1} 形状</span>
                            <div class="grid grid-2">
                                <div><span class="label">波形</span><select class="input-box" onchange="channels[${idx}].segments[${si}].type=this.value; draw();"><option value="square" ${s.type==='square'?'selected':''}>方波</option><option value="ramp" ${s.type==='ramp'?'selected':''}>三角波</option></select></div>
                                <div><span class="label">周期 (T)</span><input type="number" class="input-box" value="${s.per}" oninput="channels[${idx}].segments[${si}].per=parseFloat(this.value); draw();"></div>
                            </div>
                            <div class="grid grid-3" style="margin-bottom:0;">
                                <div><span class="label">基准Y</span><input type="number" class="input-box" value="${s.yOff}" oninput="channels[${idx}].segments[${si}].yOff=parseFloat(this.value); draw();"></div>
                                <div><span class="label">幅值 (A)</span><input type="number" step="0.1" class="input-box" value="${s.amp}" oninput="channels[${idx}].segments[${si}].amp=parseFloat(this.value); draw();"></div>
                                <div><span class="label">占空比%</span><input type="number" class="input-box" value="${s.duty}" oninput="channels[${idx}].segments[${si}].duty=parseFloat(this.value); draw();"></div>
                            </div>
                        </div>`).join('')}
                    <button class="btn-del" onclick="channels.splice(${idx},1); render();">移除通道</button>
                </div>`;
            container.appendChild(m);
        });
        draw();
    }

    function draw() {
        const W = 800, H = 600, Margin = 40;
        const GX = parseFloat(document.getElementById('gX').value) || 60, GY = parseFloat(document.getElementById('gY').value) || 60;
        const gCol = document.getElementById('gCol').value, gStr = document.getElementById('gStr').value, gDash = document.getElementById('gSty').value === 'dashed' ? '5,5' : '';

        let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:#fff; border-radius:16px;">`;
        if(document.getElementById('gridV').checked) for(let x=Margin; x<=W-Margin; x+=GX) svg += `<line x1="${x}" y1="${Margin}" x2="${x}" y2="${H-Margin}" stroke="${gCol}" stroke-width="${gStr}" stroke-dasharray="${gDash}" />`;
        if(document.getElementById('gridH').checked) for(let y=Margin; y<=H-Margin; y+=GY) svg += `<line x1="${Margin}" y1="${y}" x2="${W-Margin}" y2="${y}" stroke="${gCol}" stroke-width="${gStr}" stroke-dasharray="${gDash}" />`;

        let totalSum = new Array(W).fill(0);
        channels.forEach(c => {
            const totalPer = c.segments.reduce((acc, s) => acc + s.per, 0);
            const totalPx = (totalPer || 1) * GX;
            let pts = [];
            for(let x = Margin; x <= W-Margin; x++) {
                let relX = (x - Margin + (c.shift || 0) * GX) % totalPx;
                if(relX < 0) relX += totalPx; 
                let accum = 0, val = 0, segY = 0;
                for(let s of c.segments) {
                    let sPx = s.per * GX;
                    if (relX < accum * GX + sPx) {
                        let t = (relX - accum * GX) / (sPx || 1), d = (s.duty || 50)/100;
                        val = (s.type==='square') ? (t<d?-1:1)*s.amp : (t<d?1-2*(t/(d||0.01)):-1+2*((t-d)/(1-d||0.01)))*s.amp;
                        segY = s.yOff; break;
                    }
                    accum += s.per;
                }
                if (c.visible) pts.push(`${x},${Margin + segY * GY + val * GY}`);
                if (sumSelection.includes(c.id)) totalSum[x] += val;
            }
            if (c.visible && pts.length > 0) svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="${c.color}" stroke-width="${c.stroke}" stroke-linecap="round" stroke-linejoin="round" />`;
        });

        if(document.getElementById('sumEnable').checked && sumSelection.length > 0) {
            const sY = parseFloat(document.getElementById('sY').value), sCol = document.getElementById('sCol').value, sStr = document.getElementById('sStr').value;
            let sPts = [];
            for(let x = Margin; x <= W-Margin; x++) sPts.push(`${x},${Margin + sY * GY + totalSum[x] * GY}`);
            svg += `<polyline points="${sPts.join(' ')}" fill="none" stroke="${sCol}" stroke-width="${sStr}" stroke-linecap="round" stroke-linejoin="round" />`;
        }
        document.getElementById('svgFrame').innerHTML = svg + `</svg>`;
    }
    render();
</script>
</body>
</html>
