<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信号编辑器 - 全折叠交互版</title>
    <style>
        * { box-sizing: border-box; }
        :root { --primary: #0078d4; --bg: #f4f7f9; --border: #dcdfe6; }
        body { font-family: "Segoe UI", sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: #333; }
        
        /* 侧边栏 */
        .sidebar { 
            width: 320px; 
            background: white; 
            border-right: 1px solid var(--border); 
            overflow-y: auto; 
            padding: 15px; 
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex-shrink: 0;
        }
        
        h3 { 
            margin-top: 0; 
            margin-bottom: 15px;
            color: var(--primary); 
            border-bottom: 2px solid var(--primary); 
            padding-bottom: 6px; 
            font-size: 16px; 
            flex-shrink: 0;
        }
        
        /* 通用卡片/面板样式 */
        .panel { 
            background: #fff; 
            border: 1px solid var(--border); 
            border-radius: 6px; 
            margin-bottom: 10px; 
            overflow: hidden; 
            transition: all 0.3s ease;
        }
        
        .panel-header { 
            padding: 10px 12px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-weight: bold; 
            font-size: 13px;
            user-select: none;
        }
        
        .panel-header:hover { 
            background: #f9fafc; 
        }
        
        .panel-content { 
            padding: 12px; 
            display: none; 
            border-top: 1px solid #eee; 
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        
        /* 激活状态 */
        .panel.active .panel-content { 
            display: block;
            max-height: 2000px;
        }
        
        .panel.active .panel-header { 
            background: #f0f7ff; 
            color: var(--primary); 
        }

        /* 特殊样式的背景面板 */
        .global-panel { border-color: #c2e1ff; }
        .global-panel.active .panel-header { background: #f0f7ff; }

        /* 输入控件 */
        .input-group { margin-bottom: 10px; font-size: 12px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 3px; font-weight: 500; }
        .val-text { color: var(--primary); font-family: monospace; font-weight: bold; }
        input[type="range"] { width: 100%; cursor: pointer; }
        input[type="color"] { border: 1px solid #ccc; width: 45px; height: 22px; cursor: pointer; padding: 0; }
        select, input[type="number"] { width: 100%; padding: 5px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; }
        
        .btn-add { background: #107c10; color: white; border:none; padding:10px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; margin-bottom:8px; transition: 0.2s; flex-shrink: 0; font-size: 13px; }
        .btn-add:hover { background: #0e6c0e; }
        .btn-exp { background: var(--primary); color: white; border:none; padding:10px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; transition: 0.2s; flex-shrink: 0; font-size: 13px; }
        .btn-exp:hover { background: #005a9e; }
        .btn-remove { width:auto; color:#d93025; background:none; border:none; cursor:pointer; font-size:11px; transition: 0.2s; }
        .btn-remove:hover { color:#c5221f; }

        /* 信号列表容器 */
        .signals-container {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            min-height: 0;
        }

        /* 画布 */
        .main { 
            flex-grow: 1; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-start;
            overflow: auto;
            width: 100%;
            min-width: 0;
        }
        
        .main-header {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .title-input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            min-width: 200px;
        }

        .title-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(0, 120, 212, 0.1);
        }
        
        .canvas-wrapper { 
            background: white; 
            padding: 15px; 
            border-radius: 4px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            overflow: auto;
        }
        
        .canvas-wrapper svg {
            max-width: 100%;
            height: auto;
            display: block;
        }
        
        /* 箭头动画 - 上下箭头 */
        .arrow { 
            width: 8px;
            height: 8px;
            border: solid #666; 
            border-width: 2px 0 0 0; 
            display: inline-block; 
            transform: rotate(-45deg);
            transition: transform 0.3s ease;
            margin-left: 4px;
        }
        
        .panel.active .arrow { 
            transform: rotate(135deg);
        }
        
        .flex-row { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            justify-content: space-between; 
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .sidebar { width: 300px; }
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 35vh; border-right: none; border-bottom: 1px solid var(--border); flex-shrink: 0; }
            .main { padding: 10px; }
            .canvas-wrapper { padding: 10px; }
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h3>Visio信号生成器</h3>
    
    <div class="panel global-panel active" id="bgPanel">
        <div class="panel-header" onclick="toggleBgPanel()">
            <span>⚙️ 背景网格参数</span>
            <i class="arrow"></i>
        </div>
        <div class="panel-content">
            <div class="input-group">
                <div class="label-row"><span>X轴跨度 / Y轴高度 (px)</span></div>
                <div class="flex-row">
                    <input type="number" id="gridX" value="50" oninput="updateBase()" min="10" max="200">
                    <input type="number" id="gridY" value="40" oninput="updateBase()" min="10" max="200">
                </div>
            </div>
            
            <div class="input-group">
                <div class="label-row"><span>网格线条宽度</span> <span class="val-text" id="v-gridStroke">0.5</span></div>
                <input type="range" id="gridStroke" min="0.1" max="3" step="0.1" value="0.5" oninput="updateBase()">
            </div>

            <div class="input-group">
                <div class="label-row"><span>网格线样式</span></div>
                <select id="gridStyle" onchange="draw()">
                    <option value="2,2">虚线 (Dashed)</option>
                    <option value="0">实线 (Solid)</option>
                    <option value="5,5">长虚线 (Long Dash)</option>
                </select>
            </div>

            <div class="input-group flex-row">
                <span>网格颜色</span>
                <input type="color" id="gridColor" value="#cccccc" onchange="draw()">
            </div>
        </div>
    </div>

    <div class="signals-container" id="signalsList"></div>
    
    <button class="btn-add" onclick="addSignal()">+ 添加信号通道</button>
    <button class="btn-exp" onclick="downloadSVG()">导出 SVG 至 Visio</button>
</div>

<div class="main">
    <div class="main-header">
        <label for="titleInput" style="font-weight: bold; color: var(--primary);">标题：</label>
        <input type="text" id="titleInput" class="title-input" value="信号波形图" onchange="draw()" placeholder="输入波形标题">
    </div>
    <div class="canvas-wrapper" id="svgContainer"></div>
</div>

<script>
    let signals = [
        { id: 1, type: 'square', amp: 2, duty: 50, phase: 0, yGrid: 4, color: '#d93025', stroke: 2, isOpen: true }
    ];

    let gridConfig = { x: 50, y: 40, stroke: 0.5 };

    // 切换背景面板折叠状态
    function toggleBgPanel() {
        const panel = document.getElementById('bgPanel');
        panel.classList.toggle('active');
    }

    function updateBase() {
        gridConfig.x = parseInt(document.getElementById('gridX').value) || 50;
        gridConfig.y = parseInt(document.getElementById('gridY').value) || 40;
        gridConfig.stroke = parseFloat(document.getElementById('gridStroke').value);
        document.getElementById('v-gridStroke').innerText = gridConfig.stroke;
        draw();
    }

    function addSignal() {
        const lastY = signals.length > 0 ? signals[signals.length-1].yGrid : 2;
        signals.forEach(s => s.isOpen = false);
        signals.push({
            id: Date.now(),
            type: 'square', amp: 1, duty: 50, phase: 0, yGrid: lastY + 5, color: '#188038', stroke: 2, isOpen: true
        });
        render();
    }

    function toggleCard(id) {
        const sig = signals.find(s => s.id === id);
        if (sig) sig.isOpen = !sig.isOpen;
        render();
    }

    function updateSig(id, key, val) {
        let s = signals.find(x => x.id === id);
        if (!s) return;
        s[key] = (key==='type' || key==='color') ? val : parseFloat(val);
        const display = document.getElementById(`val-${id}-${key}`);
        if(display) display.innerText = val;
        draw();
    }

    function removeSignal(id) {
        signals = signals.filter(x => x.id !== id);
        render();
    }

    function render() {
        const list = document.getElementById('signalsList');
        list.innerHTML = '';
        signals.forEach((s, i) => {
            const card = document.createElement('div');
            card.className = `panel ${s.isOpen ? 'active' : ''}`;
            card.innerHTML = `
                <div class="panel-header" onclick="toggleCard(${s.id})">
                    <span><strong>#${i+1}</strong> <small>${s.type==='square'?'方波':'斜坡'}</small></span>
                    <i class="arrow"></i>
                </div>
                <div class="panel-content">
                    <div class="input-group">
                        <div class="label-row"><span>波形类型</span></div>
                        <select onchange="updateSig(${s.id}, 'type', this.value)">
                            <option value="square" ${s.type==='square'?'selected':''}>方波 (Square)</option>
                            <option value="ramp" ${s.type==='ramp'?'selected':''}>斜坡 (Ramp)</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>垂直位置 (Y)</span> <span class="val-text" id="val-${s.id}-yGrid">${s.yGrid}</span></div>
                        <input type="range" min="1" max="40" value="${s.yGrid}" oninput="updateSig(${s.id}, 'yGrid', this.value)">
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>波形线宽</span> <span class="val-text" id="val-${s.id}-stroke">${s.stroke}</span></div>
                        <input type="range" min="0.5" max="10" step="0.5" value="${s.stroke}" oninput="updateSig(${s.id}, 'stroke', this.value)">
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>幅值 (格)</span> <span class="val-text" id="val-${s.id}-amp">${s.amp}</span></div>
                        <input type="range" min="0.1" max="6" step="0.1" value="${s.amp}" oninput="updateSig(${s.id}, 'amp', this.value)">
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>占空比 (%)</span> <span class="val-text" id="val-${s.id}-duty">${s.duty}</span></div>
                        <input type="range" min="5" max="95" step="5" value="${s.duty}" oninput="updateSig(${s.id}, 'duty', this.value)">
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>相位 (°)</span> <span class="val-text" id="val-${s.id}-phase">${s.phase}</span></div>
                        <input type="range" min="0" max="360" step="10" value="${s.phase}" oninput="updateSig(${s.id}, 'phase', this.value)">
                    </div>
                    <div class="input-group flex-row">
                        <span>波形颜色</span>
                        <input type="color" value="${s.color}" onchange="updateSig(${s.id}, 'color', this.value)">
                    </div>
                    <div style="text-align:right; margin-top:8px">
                        <button class="btn-remove" onclick="removeSignal(${s.id})">移除通道</button>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
        draw();
    }

    function draw() {
        const margin = 50, W = 800, H = 700;
        const GX = gridConfig.x;
        const GY = gridConfig.y;
        const GStroke = gridConfig.stroke;
        const gColor = document.getElementById('gridColor').value;
        const gStyle = document.getElementById('gridStyle').value;
        const title = document.getElementById('titleInput').value || '信号波形图';

        let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:white; border: 1px solid #e0e0e0;">`;
        
        // 绘制标题
        svg += `<text x="${W/2}" y="30" font-family="Arial" font-size="18" font-weight="bold" fill="#333" text-anchor="middle">${title}</text>`;
        
        const dashAttr = gStyle === "0" ? "" : `stroke-dasharray="${gStyle}"`;
        const contentMargin = 70;

        // 绘制背景网格
        for(let x=margin; x <= W-margin; x += GX) {
            svg += `<line x1="${x}" y1="${contentMargin}" x2="${x}" y2="${H-margin}" stroke="${gColor}" stroke-width="${GStroke}" ${dashAttr} />`;
        }
        for(let y=contentMargin; y <= H-margin; y += GY) {
            svg += `<line x1="${margin}" y1="${y}" x2="${W-margin}" y2="${y}" stroke="${gColor}" stroke-width="${GStroke}" ${dashAttr} />`;
        }

        // 绘制边框
        svg += `<rect x="${margin}" y="${contentMargin}" width="${W-2*margin}" height="${H-contentMargin-margin}" fill="none" stroke="#999" stroke-width="1" />`;

        // 绘制信号波形
        signals.forEach((sig, idx) => {
            const baseY = contentMargin + sig.yGrid * GY;
            const ampPx = sig.amp * GY;
            const periodPx = 4 * GX;
            const phaseShift = (sig.phase / 360) * periodPx;
            
            let pts = [];
            for(let x=margin; x <= W-margin; x += 1) {
                let t = ((x - margin + phaseShift) % periodPx) / periodPx;
                let y = (sig.type === 'square') 
                    ? (t < (sig.duty/100) ? baseY - ampPx : baseY + ampPx)
                    : (baseY + ampPx * (1 - 2 * t));
                pts.push(`${x},${y}`);
            }
            
            // 基准线
            svg += `<line x1="${margin}" y1="${baseY}" x2="${W-margin}" y2="${baseY}" stroke="#ccc" stroke-width="1" stroke-dasharray="3,3" />`;
            // 波形
            svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="${sig.color}" stroke-width="${sig.stroke}" stroke-linecap="round" stroke-linejoin="round" />`;
            // 通道标签
            svg += `<text x="${margin-35}" y="${baseY+4}" font-family="Arial" font-size="12" fill="#666" text-anchor="end">CH${idx+1}</text>`;
        });

        svg += `</svg>`;
        document.getElementById('svgContainer').innerHTML = svg;
    }

    function downloadSVG() {
        const content = document.getElementById('svgContainer').innerHTML;
        const blob = new Blob([content], {type: 'image/svg+xml;charset=utf-8'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Signal_Editor_${new Date().getTime()}.svg`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // 初始化
    render();
</script>
</body>
</html>
