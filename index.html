<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信号编辑器VISIO版</title>
    <style>
        * { box-sizing: border-box; }
        :root { --primary: #0078d4; --bg: #f4f7f9; --border: #dcdfe6; --panel-bg: #ffffff; }
        body { font-family: "Segoe UI", system-ui, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg); color: #333; overflow: hidden; }
        
        /* 侧边栏：一级滑动 */
        .sidebar { 
            width: 320px; 
            background: white; 
            border-right: 1px solid var(--border); 
            display: flex;
            flex-direction: column;
            height: 100vh;
            flex-shrink: 0;
        }

        .sidebar-header { padding: 20px 15px 10px; flex-shrink: 0; }
        h3 { margin: 0; color: var(--primary); border-bottom: 2px solid var(--primary); padding-bottom: 8px; font-size: 18px; }

        .sidebar-scroll-area {
            flex: 1;
            overflow-y: auto; 
            padding: 10px 15px 20px;
        }
        
        /* 面板样式 */
        .panel { 
            background: var(--panel-bg); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            margin-bottom: 12px; 
        }
        
        .panel-header { 
            padding: 12px; 
            cursor: pointer; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-weight: 600; 
            font-size: 13px;
            user-select: none;
            background: #fcfcfc;
        }
        
        .panel-header:hover { background: #f0f7ff; }

        .type-badge {
            background: #e1f0ff;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-left: 8px;
            border: 1px solid #cce5ff;
        }
        
        /* 面板内容：二级滑动（选项内部可滑动） */
        .panel-content { 
            padding: 15px; 
            display: none; 
            border-top: 1px solid #eee; 
            max-height: 320px; 
            overflow-y: auto; 
        }
        
        .panel.active .panel-content { display: block; }
        .panel.active .panel-header { background: #f0f7ff; color: var(--primary); }

        /* 输入控件 */
        .input-group { margin-bottom: 12px; font-size: 12px; }
        .label-row { display: flex; justify-content: space-between; margin-bottom: 4px; color: #666; }
        input[type="number"], select { width: 100%; padding: 6px; border: 1px solid var(--border); border-radius: 4px; outline: none; }
        input[type="color"] { border: 1px solid #ccc; width: 50px; height: 24px; cursor: pointer; padding: 0; background: none; }
        .flex-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        
        .btn-add { background: #107c10; color: white; border:none; padding:12px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; margin-bottom: 10px; }
        .btn-exp { background: var(--primary); color: white; border:none; padding:10px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold; font-size: 12px; }
        .btn-remove { color:#d93025; background:none; border:none; cursor:pointer; font-size:11px; }

        .main { flex-grow: 1; padding: 20px; display: flex; justify-content: center; align-items: center; overflow: auto; }
        .canvas-wrapper { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        .arrow { border: solid #999; border-width: 0 2px 2px 0; display: inline-block; padding: 3px; transform: rotate(45deg); transition: 0.3s; }
        .panel.active .arrow { transform: rotate(-135deg); }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 10px; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">
        <h3>信号编辑器</h3>
    </div>
    
    <div class="sidebar-scroll-area">
        <div class="panel active" id="bgPanel">
            <div class="panel-header" onclick="togglePanel('bgPanel')">
                <span>⚙️ 背景网格参数</span>
                <i class="arrow"></i>
            </div>
            <div class="panel-content">
                <div class="input-group flex-row">
                    <label style="cursor:pointer"><input type="checkbox" id="showHGrid" checked onchange="draw()"> 显示横向网格</label>
                </div>
                <div class="input-group flex-row">
                    <label style="cursor:pointer"><input type="checkbox" id="showVGrid" checked onchange="draw()"> 显示纵向网格</label>
                </div>
                <div class="input-group">
                    <div class="label-row"><span>线条宽度 (px)</span></div>
                    <input type="number" id="gridStroke" min="0.5" max="10" step="0.5" value="2" oninput="draw()">
                </div>
                <div class="input-group">
                    <div class="label-row"><span>横向跨度 (X)</span></div>
                    <input type="number" id="gridX" value="50" oninput="draw()" min="10">
                </div>
                <div class="input-group">
                    <div class="label-row"><span>纵向跨度 (Y)</span></div>
                    <input type="number" id="gridY" value="50" oninput="draw()" min="10">
                </div>
                <div class="input-group flex-row">
                    <span>网格颜色</span>
                    <input type="color" id="gridColor" value="#444444" onchange="draw()">
                </div>
                <div class="input-group">
                    <div class="label-row"><span>网格样式</span></div>
                    <select id="gridStyle" onchange="draw()">
                        <option value="5,5" selected>虚线 (Dashed)</option>
                        <option value="0">实线 (Solid)</option>
                        <option value="2,2">点线 (Dotted)</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="signalsList"></div>
        
        <button class="btn-add" onclick="addSignal()">+ 添加信号通道</button>
        <button class="btn-exp" onclick="downloadSVG()">导出 SVG 图像</button>
    </div>
</div>

<div class="main">
    <div class="canvas-wrapper" id="svgContainer"></div>
</div>

<script>
    let signals = [
        { id: 1, type: 'square', amp: 1, duty: 50, phase: 180, period: 4, yOffset: 2, color: '#0078d4', stroke: 4, isOpen: true }
    ];

    function togglePanel(id) {
        document.getElementById(id).classList.toggle('active');
    }

    function addSignal() {
        signals.forEach(s => s.isOpen = false);
        signals.push({
            id: Date.now(),
            type: 'square', amp: 1, duty: 50, phase: 180, period: 4, yOffset: signals.length * 3 + 2, color: '#188038', stroke: 4, isOpen: true
        });
        render();
    }

    function updateSig(id, key, val) {
        let s = signals.find(x => x.id === id);
        if (s) {
            s[key] = (key==='type' || key==='color') ? val : parseFloat(val);
            if (key === 'type') {
                const badge = document.querySelector(`#sig-${id} .type-badge`);
                if (badge) badge.innerText = val === 'square' ? '方波' : '斜坡';
            }
            draw();
        }
    }

    function removeSignal(id) {
        signals = signals.filter(x => x.id !== id);
        render();
    }

    function render() {
        const list = document.getElementById('signalsList');
        list.innerHTML = '';
        signals.forEach((s, i) => {
            const typeText = s.type === 'square' ? '方波' : '斜坡';
            const card = document.createElement('div');
            card.className = `panel ${s.isOpen ? 'active' : ''}`;
            card.id = `sig-${s.id}`;
            card.innerHTML = `
                <div class="panel-header" onclick="togglePanel('sig-${s.id}')">
                    <div style="display:flex; align-items:center">
                        <span><strong>#${i+1}</strong> 通道</span>
                        <span class="type-badge">${typeText}</span>
                    </div>
                    <i class="arrow"></i>
                </div>
                <div class="panel-content">
                    <div class="input-group">
                        <div class="label-row"><span>波形类型</span></div>
                        <select onchange="updateSig(${s.id}, 'type', this.value)">
                            <option value="square" ${s.type==='square'?'selected':''}>方波</option>
                            <option value="ramp" ${s.type==='ramp'?'selected':''}>斜坡</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>基准位置 (Y)</span></div>
                        <input type="number" value="${s.yOffset}" oninput="updateSig(${s.id}, 'yOffset', this.value)">
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>幅值 (格)</span></div>
                        <input type="number" step="0.1" value="${s.amp}" oninput="updateSig(${s.id}, 'amp', this.value)">
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>周期 (格)</span></div>
                        <input type="number" step="0.5" value="${s.period}" oninput="updateSig(${s.id}, 'period', this.value)">
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>波形相位 (°)</span></div>
                        <input type="number" min="0" max="360" step="1" value="${s.phase}" oninput="updateSig(${s.id}, 'phase', this.value)">
                    </div>
                    <div class="input-group">
                        <div class="label-row"><span>波形线宽 (px)</span></div>
                        <input type="number" min="0.5" step="0.5" value="${s.stroke}" oninput="updateSig(${s.id}, 'stroke', this.value)">
                    </div>
                    <div class="input-group flex-row">
                        <span>颜色</span>
                        <input type="color" value="${s.color}" onchange="updateSig(${s.id}, 'color', this.value)">
                    </div>
                    <div style="text-align: right; margin-top: 10px;">
                        <button class="btn-remove" onclick="removeSignal(${s.id})">移除通道</button>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
        draw();
    }

    function draw() {
        const W = 800, H = 600, margin = 40;
        const GX = parseInt(document.getElementById('gridX').value) || 50;
        const GY = parseInt(document.getElementById('gridY').value) || 50;
        const GStroke = document.getElementById('gridStroke').value;
        const GColor = document.getElementById('gridColor').value;
        const GStyle = document.getElementById('gridStyle').value;
        const showH = document.getElementById('showHGrid').checked;
        const showV = document.getElementById('showVGrid').checked;

        let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="background:white;">`;
        const dash = GStyle === "0" ? "" : `stroke-dasharray="${GStyle}"`;

        if (showV) {
            for(let x = margin; x <= W - margin; x += GX) {
                svg += `<line x1="${x}" y1="${margin}" x2="${x}" y2="${H-margin}" stroke="${GColor}" stroke-width="${GStroke}" ${dash} />`;
            }
        }
        if (showH) {
            for(let y = margin; y <= H - margin; y += GY) {
                svg += `<line x1="${margin}" y1="${y}" x2="${W-margin}" y2="${y}" stroke="${GColor}" stroke-width="${GStroke}" ${dash} />`;
            }
        }

        signals.forEach(sig => {
            const baseY = margin + sig.yOffset * GY;
            const ampPx = sig.amp * GY;
            const periodPx = sig.period * GX;
            const phaseShift = (sig.phase / 360) * periodPx; // 计算相位导致的位移
            
            let pts = [];
            for(let x = margin; x <= W - margin; x++) {
                // 计算带相位的标准化时间参数 t (0-1)
                let t = ((x - margin + phaseShift) % periodPx) / periodPx;
                if (t < 0) t += 1;

                let y = (sig.type === 'square') 
                    ? ((t < 0.5) ? baseY - ampPx : baseY + ampPx) 
                    : (baseY + ampPx * (1 - 2 * t));
                pts.push(`${x},${y}`);
            }
            svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="${sig.color}" stroke-width="${sig.stroke}" stroke-linejoin="round" stroke-linecap="round" />`;
        });

        svg += `</svg>`;
        document.getElementById('svgContainer').innerHTML = svg;
    }

    function downloadSVG() {
        const content = document.getElementById('svgContainer').innerHTML;
        const blob = new Blob([content], {type: 'image/svg+xml'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `signal_editor_${Date.now()}.svg`;
        a.click();
    }

    render();
</script>
</body>
</html>
